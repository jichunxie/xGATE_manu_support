# Convenience conda environment for the xGATE Python analyses.
#
# This is a minimal, loosely pinned Python environment. For exact manuscript
# snapshots, see the files under envs/ and docs/r_environment.md.
#
# The xGATE METHOD is a SEPARATE repo (https://github.com/jichunxie/xGATE); this
# reproducibility repo depends on it, installed pinned to the manuscript release
# tag via the pip section below. Imported as `import xGATE.utilities`.
# NOTE: the @v1.0 pin requires the xGATE repo to be PUBLIC and TAGGED v1.0; for an
# archival-exact build use the release commit hash. See docs/xgate_dependency_plan.md.

name: xgate-manu
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.10.20
  - numpy=1.26.4
  - pandas=2.3.3
  - scipy=1.15.2
  - statsmodels=0.14.6
  - scikit-learn=1.7.2
  - networkx=3.4.2
  - python-igraph=1.0.0
  - matplotlib=3.10.9
  - seaborn=0.13.2
  - pillow=12.0.0
  - h5py=3.13.0
  - pytables=3.10.1
  - openpyxl=3.1.5
  - biopython=1.87
  - pyyaml          # optional (config loading); not in the manuscript env snapshot
  - jupyterlab      # optional (biology notebooks)
  - notebook        # optional
  - pip
  - pip:
      - scanpy==1.11.5
      - anndata==0.11.4
      - torch==2.12.0
      - mygene==3.2.2
      # xGATE method package (manuscript release):
      - git+https://github.com/jichunxie/xGATE.git@v1.0
